# 0.35 m/s; steering endpoints come from driver_calibration.yaml.
# =====================================================
# racecar Nav2 参数 - Cartographer SLAM 模式
# 基于 nav.yaml 移植，关键改动：
#   1. AMCL 已禁用（改名为 amcl_disabled）
#   2. odom frame 从 odom_combined 改为 odom（Cartographer 模式）
#   3. 不需要 map_server（Cartographer 实时发布 /map）
#   4. use_sim_time 全部 False（实车）
# =====================================================

amcl_disabled:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /home/bianbu/racecar/install/racecar/share/racecar/config/navigate_to_pose_replanning.xml
    default_nav_through_poses_bt_xml: /home/bianbu/racecar/install/racecar/share/racecar/config/navigate_through_poses_replanning.xml
    use_sim_time: False
    transform_tolerance: 0.1
    goal_reached_tol: 0.6
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    odom_topic: /scan_motion_feedback
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "racecar_multipoint_controller::OrderedGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 1.5
      stateful: True
    FollowPath:
      plugin: "racecar_multipoint_controller::MultiPointController"
      multipoint_enabled: true
      tracking_mode: ordered_single
      preview_spacing_m: 0.01
      curvature_sample_spacing_m: 0.3  # Chord length for local circle curvature.
      progress_search_ahead_m: 0.5
      desired_linear_vel: 2.0
      lookahead_dist: 1.3
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.3
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.15
      use_velocity_scaled_lookahead_dist: false  # Fixed 1.3 m lookahead.
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      terminal_deceleration_mps2: 6.0  # Final-route slowdown; calibrate against actual stopping.
      terminal_response_time_s: 0.2
      terminal_stop_margin_m: 0.15
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 1.0
      curvature_min_speed: 1.7  # Independent of the obstacle speed floor above.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: .inf
      max_robot_pose_search_dist: 3.0
      use_interpolation: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 0.8
      inflation_cost_scaling_factor: 10.0
      goal_dist_tol: 0.08
      allow_reversing: false

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.60
      footprint: "[[-0.20, -0.15], [-0.20, 0.15], [0.20, 0.15], [0.20, -0.15]]"
      footprint_padding: 0.0  # Hard collision uses the physical body; inflation costs prefer clearance.
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.35
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      always_send_full_costmap: False
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.60
      footprint: "[[-0.20, -0.15], [-0.20, 0.15], [0.20, 0.15], [0.20, -0.15]]"
      footprint_padding: 0.0  # Hard collision uses the physical body; inflation costs prefer clearance.
      resolution: 0.2
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

# Cartographer 模式不需要 map_server 提供静态地图
# Cartographer occupancy_grid_node 实时发布 /map
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 10.0
    GridBased:
      plugin: "racecar_smac_planner/SmacPlannerHybrid"
      final_path_collision_stop_enabled: false  # Keep raw search path if the additional returned-path audit fails.
      final_path_collision_tolerance_m: 0.0  # Keep the full physical body; no hard padding or body shrink.
      tolerance: 0.1
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 7.0
      motion_model_for_search: "DUBIN"
      cost_travel_multiplier: 2.0
      angle_quantization_bins: 64
      goal_heading_tolerance_deg: 10.0  # Planning cone; separate from arrival yaw tolerance.
      analytic_expansion_ratio: 4.0
      minimum_turning_radius: 0.6  # Geometric lower bound; independent of vehicle speed.
      reverse_penalty: 10.0
      change_penalty: 1.5
      non_straight_penalty: 2.00
      cost_penalty: 3.5  # Finite wall-clearance preference, shared by search and path refinement.
      lookup_table_size: 8.0
      cache_obstacle_heuristic: True
      smoother:
        preferred_turning_radius: 1.2  # Prefer wider endpoint arcs; fall back to the 0.6 m plan.
        max_iterations: 2000
        w_smooth: 0.5
        w_data: 0.1
        tolerance: 1.0e-12

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 5.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Angular speed/acceleration are unbounded here; calibrated steering endpoints still apply.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 100.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, .inf]
    min_velocity: [0.0, 0.0, -.inf]
    max_accel: [.inf, 0.0, .inf]
    max_decel: [-.inf, 0.0, -.inf]
    odom_topic: "/scan_motion_feedback"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
